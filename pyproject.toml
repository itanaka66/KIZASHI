[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kizashi"
version = "0.1.0"
description = "AI-based failure prediction for network monitoring on Prometheus"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "prometheus_client>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# P2: multivariate anomaly detection
multivariate = ["scikit-learn>=1.4"]
# P2: log pattern anomaly detection via Loki (no extra Python deps)
loki = []
dev = ["pytest>=8", "scikit-learn>=1.4"]

[project.scripts]
kizashi = "kizashi.cli:main"

[tool.setuptools.packages.find]
include = ["kizashi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
