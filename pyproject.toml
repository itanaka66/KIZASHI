[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kizashi"
version = "0.1.0"
description = "AI-based failure prediction for network monitoring on Prometheus"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "prometheus_client>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# P2: multivariate anomaly detection
multivariate = ["scikit-learn>=1.4"]
# P2: log pattern anomaly detection via Loki (no extra Python deps)
loki = []
# P3: feedback API
feedback = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
# P4: supervised failure probability prediction
p4 = ["lightgbm>=4.3", "shap>=0.45", "scikit-learn>=1.4", "joblib>=1.3"]
# P4: MLflow model registry integration (optional)
mlflow = ["mlflow>=2.12"]
dev = ["pytest>=8", "scikit-learn>=1.4", "fastapi>=0.111", "httpx>=0.27", "lightgbm>=4.3", "shap>=0.45"]

[project.scripts]
kizashi = "kizashi.cli:main"

[tool.setuptools.packages.find]
include = ["kizashi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
