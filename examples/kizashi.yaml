# KIZASHI configuration example. ${VAR} and ${VAR:-default} are expanded from the environment.
prometheus:
  url: http://prometheus:9090
  # Training uses VictoriaMetrics for long-term history (13-month retention).
  long_term_url: ${KIZASHI_LONG_TERM_URL:-http://victoriametrics:8428}
  timeout: 30s
  # bearer_token_file: /var/run/secrets/prometheus-token

# Alertmanager — optional. When set, active silences are fetched at training time
# and the corresponding time windows (plus silence_buffer on each side) are excluded
# from the baseline fit, so past incidents do not distort the seasonal profile.
# alertmanager:
#   url: http://alertmanager:9093
#   silence_buffer: 30m

# Jira Service Management — optional. When set, KIZASHI creates Jira issues
# when predictive alerts fire, with deduplication by instance+interface+failure_mode.
# Requires environment variable JIRA_API_TOKEN (or the name set in api_token_env).
# jira:
#   url: https://your-org.atlassian.net
#   email: kizashi-bot@your-org.com
#   api_token_env: JIRA_API_TOKEN
#   project_key: NWOPS
#   issue_type: Incident

# LLM — optional. When set, KIZASHI generates a Japanese natural-language explanation
# for each predictive alert using a local Ollama server.
# Recommended models:
#   GPU (VRAM >= 16GB): qwen2.5:14b
#   CPU / GPU (VRAM 8GB): qwen2.5:7b
#   Low-memory:          qwen2.5:3b  or  llama3.2:3b
# llm:
#   url: http://ollama:11434
#   model: qwen2.5:7b
#   timeout: 30s

server:
  listen: 0.0.0.0:9850

models:
  dir: /var/lib/kizashi/models

inference:
  interval: 1m
  window: 6h          # history used for the trend fit
  step: 1m
  shard:
    total: ${KIZASHI_SHARD_TOTAL:-1}
    index: ${KIZASHI_SHARD_INDEX:-0}
  forecast_horizons: [1h, 24h]
  emit_forecast_min_score: 3

training:
  period: 28d
  step: 5m

baseline:
  band_sigma: 3

trend:
  confidence: 0.9
  max_points: 120
  max_horizon: 30d

targets:
  - metric: kizashi:optic_rx_dbm:avg5m
    layers: [baseline, trend]
    thresholds:
      - name: rx_low
        direction: below
        by_label: transceiver_type
        # Placeholders. Use each module's datasheet receiver sensitivity plus a margin (see SETUP.md).
        values:
          10GBASE-LR: -14.4
          10GBASE-SR: -9.9
          100GBASE-LR4: -10.6

  - metric: kizashi:if_in_errors:rate5m
    layers: [baseline]

  - metric: kizashi:if_util_in:ratio5m
    layers: [baseline, trend]
    thresholds:
      - name: util_90pct
        direction: above
        value: 0.9

  - metric: kizashi:if_flaps:changes1h
    layers: [baseline]
