groups:
  - name: kizashi-predictive
    rules:
      - alert: OpticDegradationPredicted
        expr: kizashi_time_to_threshold_seconds{metric=~"kizashi:optic_.*"} < 72 * 3600
        for: 30m
        labels:
          severity: warning
          kizashi: predictive
        annotations:
          summary: >-
            {{ $labels.instance }} {{ $labels.ifName }}: optical power expected to reach
            {{ $labels.threshold }} in about {{ $value | humanizeDuration }}
          description: Replace or clean the optic before it fails.

      - alert: ResourceExhaustionPredicted
        expr: kizashi_time_to_threshold_seconds{metric!~"kizashi:optic_.*"} < 24 * 3600
        for: 30m
        labels:
          severity: warning
          kizashi: predictive
        annotations:
          summary: >-
            {{ $labels.instance }}: {{ $labels.metric }} expected to reach
            {{ $labels.threshold }} in about {{ $value | humanizeDuration }}

      - alert: MetricAnomalous
        expr: kizashi_anomaly_score{layer="baseline"} > 6
        for: 15m
        labels:
          severity: info
          kizashi: predictive
        annotations:
          summary: >-
            {{ $labels.instance }} {{ $labels.ifName }}: {{ $labels.metric }} deviates from
            its usual pattern (score {{ $value | printf "%.1f" }})

      # Topology-aware variant: carries parent_instance so Alertmanager can
      # suppress child alerts when the parent fires. Requires kizashi_topology_parent
      # to be populated (see rules/kizashi-topology.yml).
      - alert: OpticDegradationPredictedWithTopology
        expr: |
          kizashi_time_to_threshold_seconds{metric=~"kizashi:optic_.*"} < 72 * 3600
          * on(instance) group_left(parent_instance)
          max by (instance, parent_instance) (kizashi_topology_parent)
        for: 30m
        labels:
          severity: warning
          kizashi: predictive
          topology_aware: "true"
        annotations:
          summary: >-
            {{ $labels.instance }} {{ $labels.ifName }}: optical power expected to reach
            {{ $labels.threshold }} in about {{ $value | humanizeDuration }}
          description: Parent device {{ $labels.parent_instance }}

  - name: kizashi-health
    rules:
      # Fires when a service's current health score drops below 80 (warning) or 50 (critical).
      # The score is 0–100: 100 = fully healthy, 0 = all components anomalous.
      - alert: ServiceHealthDegrading
        expr: kizashi_health_score{horizon="now"} < 80
        for: 10m
        labels:
          severity: warning
          kizashi: health
        annotations:
          summary: >-
            Service {{ $labels.service }} health score is {{ $value | printf "%.0f" }}/100
          description: >-
            KIZASHI service health score has been below 80 for 10 minutes.
            Check kizashi_anomaly_score for the components in this service.

      - alert: ServiceHealthCritical
        expr: kizashi_health_score{horizon="now"} < 50
        for: 5m
        labels:
          severity: critical
          kizashi: health
        annotations:
          summary: >-
            Service {{ $labels.service }} health is critical (score {{ $value | printf "%.0f" }}/100)
          description: >-
            Multiple components of service {{ $labels.service }} are severely anomalous.
            Immediate investigation required.

  - name: kizashi-self
    rules:
      - alert: KizashiInferenceStalled
        expr: time() - max(kizashi_last_inference_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: KIZASHI has not completed an inference cycle for 10 minutes.
      - alert: KizashiQueryErrors
        expr: sum by (target) (rate(kizashi_query_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "KIZASHI cannot query Prometheus for {{ $labels.target }}."
      - alert: KizashiModelStale
        expr: time() - max by (metric) (kizashi_model_trained_timestamp_seconds) > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Baseline model for {{ $labels.metric }} has not been retrained for 3 days."
