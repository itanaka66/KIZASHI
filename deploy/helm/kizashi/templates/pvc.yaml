{{- if and .Values.models.persistence.enabled (not .Values.models.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kizashi.fullname" . }}-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.models.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.models.persistence.size }}
  {{- if .Values.models.persistence.storageClass }}
  storageClassName: {{ .Values.models.persistence.storageClass }}
  {{- end }}
{{- end }}
