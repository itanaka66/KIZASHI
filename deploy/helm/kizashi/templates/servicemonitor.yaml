{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kizashi.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "kizashi.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kizashi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inference
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      # Required: KIZASHI writes source-series labels (instance, job) onto
      # prediction metrics. Without honorLabels those labels are overwritten
      # by Prometheus with KIZASHI's own scrape target labels.
      honorLabels: true
      path: /metrics
{{- end }}
